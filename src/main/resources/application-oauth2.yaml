spring:
  config:
    activate:
      on-profile: oauth2
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

security:
  oauth2:
    frontend-success-url: ${FRONTEND_OAUTH_SUCCESS_URL}
    mobile-success-url: ${MOBILE_OAUTH_SUCCESS_URL:teambici://auth/google/callback}
    authorization-code-ttl-seconds: ${OAUTH_AUTHORIZATION_CODE_TTL_SECONDS:60}
